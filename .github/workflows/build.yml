   name: Build
   on:
     workflow_dispatch:
     push:

   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: 21
         - name: Build
           run: chmod +x gradlew && ./gradlew build
         - uses: actions/upload-artifact@v4
           with:
             name: voxy
             path: |
               build/libs/*.jar
               !build/libs/*-sources.jar
